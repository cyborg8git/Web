<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Is It Daytime?</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #07111f;
      --card: rgba(255,255,255,.10);
      --text: #f7fbff;
      --muted: #a9b8ca;
      --accent: #ffd166;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 10%, rgba(255,209,102,.16), transparent 30%),
        linear-gradient(160deg, #102744, var(--bg));
      overflow: hidden;
      transition: background .8s ease;
    }
    body.night {
      background:
        radial-gradient(circle at 70% 20%, rgba(110,140,255,.16), transparent 28%),
        linear-gradient(160deg, #111a38, #030611);
    }
    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity .8s;
      background-image:
        radial-gradient(circle, white 1px, transparent 1.5px),
        radial-gradient(circle, white 1px, transparent 1.5px);
      background-size: 90px 90px, 130px 130px;
      background-position: 10px 20px, 60px 70px;
    }
    body.night .stars { opacity: .65; }

    .card {
      width: min(92vw, 560px);
      padding: 48px 38px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 30px;
      background: var(--card);
      backdrop-filter: blur(18px);
      box-shadow: 0 25px 80px rgba(0,0,0,.35);
      position: relative;
      z-index: 1;
    }
    .icon {
      width: 110px;
      height: 110px;
      margin: 0 auto 25px;
      display: grid;
      place-items: center;
      font-size: 58px;
      border-radius: 50%;
      background: rgba(255,209,102,.15);
      box-shadow: 0 0 45px rgba(255,209,102,.12);
      transition: transform .5s, background .5s;
    }
    body.night .icon {
      background: rgba(120,145,255,.14);
      box-shadow: 0 0 45px rgba(120,145,255,.12);
    }
    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 8vw, 4rem);
      letter-spacing: -2px;
    }
    .subtitle {
      color: var(--muted);
      margin: 12px 0 30px;
      line-height: 1.5;
    }
    button {
      border: 0;
      border-radius: 999px;
      padding: 16px 28px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      color: #17202d;
      background: var(--accent);
      box-shadow: 0 10px 30px rgba(255,209,102,.2);
      transition: transform .15s, box-shadow .15s;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 14px 35px rgba(255,209,102,.3); }
    button:active { transform: translateY(1px); }

    .result {
      min-height: 105px;
      margin-top: 28px;
      display: grid;
      place-items: center;
    }
    .answer {
      font-size: 2rem;
      font-weight: 900;
      animation: pop .35s ease;
    }
    .details {
      color: var(--muted);
      margin-top: 7px;
      font-size: .92rem;
    }
    .joke {
      margin-top: 30px;
      color: rgba(255,255,255,.45);
      font-size: .78rem;
    }
    @keyframes pop {
      from { transform: scale(.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    @media (max-width: 500px) {
      .card { padding: 38px 22px; }
    }
  </style>
</head>
<body>
  <div class="stars"></div>

  <main class="card">
    <div class="icon" id="icon">☀️</div>
    <h1>Is it daytime?</h1>
    <p class="subtitle">
      A completely unnecessary website for answering a question
      you could answer by looking outside.
    </p>

    <button id="checkBtn">CHECK THE SKY</button>

    <section class="result" aria-live="polite">
      <div>
        <div class="answer" id="answer">???</div>
        <div class="details" id="details">Awaiting extremely important information...</div>
      </div>
    </section>

    <div class="joke">Powered by your computer's clock. Humanity is safe.</div>
  </main>

  <script>
    const button = document.getElementById("checkBtn");
    const answer = document.getElementById("answer");
    const details = document.getElementById("details");
    const icon = document.getElementById("icon");

    button.addEventListener("click", () => {
      const now = new Date();
      const hour = now.getHours();
      const minute = String(now.getMinutes()).padStart(2, "0");

      // For this gloriously useless project, daytime = 06:00–17:59.
      const daytime = hour >= 6 && hour < 18;

      document.body.classList.toggle("night", !daytime);
      icon.textContent = daytime ? "☀️" : "🌙";
      answer.textContent = daytime ? "YES. IT IS DAYTIME." : "NO. IT IS NIGHTTIME.";
      details.textContent =
        `Your local time is ${String(hour).padStart(2, "0")}:${minute}. ` +
        (daytime ? "The sun has apparently won." : "The moon has entered the chat.");

      answer.style.animation = "none";
      void answer.offsetWidth;
      answer.style.animation = "pop .35s ease";
    });
  </script>
</body>
</html>
